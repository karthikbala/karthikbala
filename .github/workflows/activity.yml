name: Update 90-day activity

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/activity.yml'

permissions:
  contents: read

concurrency:
  group: profile-activity
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check calendar parsing and date boundaries
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Refresh the rolling 90-day chart
        run: python3 scripts/update_activity.py
      - name: Publish updated profile assets
        run: |
          git add README.md assets/activity-90-days.svg
          if git diff --cached --quiet; then
            echo 'Activity is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh last 90 days of contribution activity'
          git push
